<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visão Arquitetural da Solução — Radar Acadêmico</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      max-width: 1260px;
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      color: #0f172a;
    }
    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(37,99,235,0.2);
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      max-width: 1260px;
      width: 100%;
      box-sizing: border-box;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Diagrama Arquitetural — Radar Acadêmico</h1>
      <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Modelo Cliente-Servidor em Camadas (Apresentação, Aplicação, Domínio e Persistência)</p>
    </div>
    <button class="btn" onclick="exportarPNG()">📥 Baixar como Imagem PNG (Alta Resolução)</button>
  </div>

  <div class="container" id="svg-container">
    <!-- O SVG é embutido diretamente aqui -->
    <object type="image/svg+xml" data="visao-arquitetural.svg" id="svg-obj" style="width: 100%; height: 530px;"></object>
  </div>

  <script>
    async function exportarPNG() {
      const response = await fetch('visao-arquitetural.svg');
      const svgText = await response.text();
      const canvas = document.createElement('canvas');
      canvas.width = 2520; // 2x para nitidez em impressao
      canvas.height = 1040;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);
      img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = 'visao-arquitetural-radar-academico.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }
  </script>
</body>
</html>
