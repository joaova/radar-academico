services:
  - type: web
    name: radar-academico
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.web:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADAR_REQUIRE_POSTGRES
        value: "1"
      - key: RADAR_SEED
        value: "1"
